services:
  hollowtone-server:
    build: .
    image: hollowtone-server:latest
    container_name: hollowtone-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist the SQLite database, audio objects and cover art here.
      - ./data:/data
    environment:
      HT_ADDR: ":8080"
      HT_DATA_DIR: "/data"
      # Set a fixed secret in production so sessions survive redeploys.
      # If omitted, one is generated and stored in /data/.jwt_secret.
      # HT_JWT_SECRET: "change-me-to-a-long-random-string"
      HT_TOKEN_TTL: "720h"
      HT_ALLOW_REGISTER: "true"
      HT_MAX_UPLOAD_BYTES: "2147483648"
      HT_CHUNK_SIZE: "8388608"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
